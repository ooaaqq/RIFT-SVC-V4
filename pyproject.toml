[project]
name = "rift-svc-v4"
version = "0.1.0"
description = "Clean-room training stack for an incompatible RIFT-SVC V4 foundation model"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=2.0.0",
    "soundfile>=0.13.1",
    "torch==2.12.1",
    "torchao==0.18.0",
    "torchaudio>=2.9.0",
    "transformers>=4.57.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.14.0",
]
features = [
    "torchfcpe==0.0.4",
]
acquisition = [
    "huggingface_hub>=0.34.0",
    "pyarrow>=18.0.0",
]

[project.scripts]
rift-v4-build-manifest = "rift_v4.manifest_cli:main"
rift-v4-datasets = "rift_v4.datasets:main"
rift-v4-manifest = "rift_v4.manifest_tools:main"
rift-v4-split = "rift_v4.split_cli:main"
rift-v4-qc = "rift_v4.qc:main"
rift-v4-extract-content = "rift_v4.extract_content:main"
rift-v4-assets = "rift_v4.assets_cli:main"
rift-v4-features = "rift_v4.features:main"
rift-v4-train = "rift_v4.train:main"
rift-v4-sampling-audit = "rift_v4.sampling_cli:main"
rift-v4-infer = "rift_v4.infer:main"
rift-v4-evaluate = "rift_v4.evaluate:main"
rift-v4-counterfactual = "rift_v4.counterfactual:main"
rift-v4-pc-nsf = "rift_v4.vocoder:main"
rift-v4-monitor = "rift_v4.monitor:main"
rift-v4-audit-checkpoint = "rift_v4.checkpoint_audit:main"
rift-v4-shadow-panel = "rift_v4.shadow_panel:main"
rift-v4-speaker-calibration = "rift_v4.speaker_metric_calibration:main"
rift-v4-shadow-v3 = "rift_v4.shadow_v3_compare:main"
rift-v4-shadow-identity = "rift_v4.shadow_identity_diagnostic:main"
rift-v4-export-release = "rift_v4.release:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rift_v4"]
